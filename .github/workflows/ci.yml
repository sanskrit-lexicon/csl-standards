name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate pilot artifacts
        run: npm run validate-pilot

      - name: Validate TEI archival profile
        run: npm run validate-tei-profile

      - name: Validate OntoLex profile
        run: npm run validate-ontolex-profile

      - name: Validate MDF profile
        run: npm run validate-mdf-profile

      - name: Smoke-test MDF consumer display
        run: npm run smoke-mdf-consumer-display

      - name: Validate LIFT profile
        run: npm run validate-lift-profile

      - name: Smoke-test LIFT consumer display
        run: npm run smoke-lift-consumer-display

      - name: Validate TEI Lex-0 baseline
        run: npm run validate-tei-lex0

      - name: Validate TEI Lex-0 against official v0.9.5 schema
        shell: bash
        run: |
          # The official v0.9.5 RNG hangs libxml2 < 2.15 forever (xmlRelaxNGSimplify
          # recursion; verified H6196 on 2.9.13 + 2.14.6, clean on 2.15.4) — and the
          # runners ship 2.9.x. Build the pinned xmllint unless the runner already
          # has >= 2.15 (libxml version encoding: major*10000 + minor*100 + patch).
          ok=0
          if command -v xmllint >/dev/null 2>&1; then
            v=$(xmllint --version 2>&1 | sed -n 's/.*using libxml version \([0-9]*\).*/\1/p')
            if [ -n "$v" ] && [ "$v" -ge 21500 ]; then ok=1; fi
          fi
          if [ "$ok" -ne 1 ]; then
            echo "building libxml2 2.15.4 (official v0.9.5 RNG hangs libxml2 < 2.15 — H6196)"
            curl -sSL --retry 3 -o /tmp/libxml2.tar.xz https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
            tar -xJf /tmp/libxml2.tar.xz -C /tmp
            (cd /tmp/libxml2-2.15.4 && ./configure --prefix=/tmp/libxml2-inst --without-python --disable-shared --enable-static > configure.log 2>&1 && make -j2 > make.log 2>&1 && make install > install.log 2>&1)
            echo "/tmp/libxml2-inst/bin" >> "$GITHUB_PATH"
            export PATH=/tmp/libxml2-inst/bin:$PATH
          fi
          npm run validate-tei-lex0-schema

      - name: Build Observable site
        run: npm run build
